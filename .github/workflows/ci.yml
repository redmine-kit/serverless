name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, to see the next Redmine (master) changing under the tests.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/lint

  services:
    needs: static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The secret is not given to pull requests from forks, so LocalStack is
      # skipped there.
      - run: bin/test-services
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - if: always()
        run: bin/test-services --down

  # Redmine's release, and master before the next release (7.1). master is
  # not pinned and does not fail the run (docs/testing.md#order-in-ci).
  image:
    needs: static
    name: image (Redmine ${{ matrix.redmine }})
    # Lambda runs the image on arm64.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        redmine: ["7.0.3", master]
    continue-on-error: ${{ matrix.redmine == 'master' }}
    env:
      REDMINE_BRANCH: ${{ matrix.redmine == 'master' && 'master' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/build-image
      - run: bin/test-image
      - if: always()
        run: bin/test-services --down

  core:
    needs: static
    name: core (Redmine ${{ matrix.redmine }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        redmine: ["7.0.3", master]
    continue-on-error: ${{ matrix.redmine == 'master' }}
    env:
      REDMINE_BRANCH: ${{ matrix.redmine == 'master' && 'master' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/test-core
      - if: always()
        run: bin/test-services --down
