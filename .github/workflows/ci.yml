name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, to see the next Redmine (master) changing under the tests.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  # The plugin gems on GitHub Packages (image/Gemfile.local).
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/lint

  # The functions that run at CloudFront (edge/).
  edge:
    needs: static
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Codecov takes the upload with an OIDC token instead of a secret.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/test-edge
      # Not failing the run until the Codecov GitHub App is installed.
      - uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage/edge.lcov
          flags: edge
          use_oidc: true
          fail_ci_if_error: false

  # bin/deploy without AWS: the schema, the stack parameters and the steps
  # against fake AWS.
  deploy:
    needs: static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/test-deploy

  services:
    needs: static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The secret is not given to pull requests from forks, so LocalStack is
      # skipped there.
      - run: bin/test-services
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - if: always()
        run: bin/test-services --down

  # Redmine's release, and master before the next release (7.1). master is
  # not pinned and does not fail the run (docs/testing.md#order-in-ci).
  image:
    needs: static
    name: image (Redmine ${{ matrix.redmine }})
    # Lambda runs the image on arm64.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        redmine: ["7.0.3", master]
    continue-on-error: ${{ matrix.redmine == 'master' }}
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      REDMINE_BRANCH: ${{ matrix.redmine == 'master' && 'master' || '' }}
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: x-access-token:${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/build-image
      - run: bin/test-image
      # The functions as Lambda on LocalStack, with the release only. The
      # secret is not given to pull requests from forks, so it is skipped
      # there.
      - if: matrix.redmine != 'master'
        run: bin/test-lambda
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - if: matrix.redmine != 'master'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage/image/image.lcov
          flags: image
          use_oidc: true
          fail_ci_if_error: false
      - if: always()
        run: bin/test-services --down
      - if: always()
        run: bin/test-lambda --down

  core:
    needs: static
    name: core (Redmine ${{ matrix.redmine }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        redmine: ["7.0.3", master]
    continue-on-error: ${{ matrix.redmine == 'master' }}
    env:
      REDMINE_BRANCH: ${{ matrix.redmine == 'master' && 'master' || '' }}
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: x-access-token:${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/test-core
      - if: always()
        run: bin/test-services --down

  # The image of a commit on main whose release tests passed, at
  # ghcr.io/redmine-kit/serverless (docs/architecture.md#distribution).
  publish:
    needs: [services, image, core]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: x-access-token:${{ github.token }}
      IMAGE: ghcr.io/redmine-kit/serverless
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/build-image "$IMAGE:main"
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version=$(bin/redmine-version "$IMAGE:main")
          for tag in "$version" "${version%.*}"; do
            docker tag "$IMAGE:main" "$IMAGE:$tag"
          done
          for tag in main "$version" "${version%.*}"; do
            docker push "$IMAGE:$tag"
          done
          docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Manifest}}' |
            jq -r '"pushed \(.digest) \(.mediaType)"'
