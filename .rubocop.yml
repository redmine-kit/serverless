AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Include:
    - '**/*.rb'
    - '**/Gemfile'
    - 'image/Gemfile.local'
  # Local checkouts of the plugins (bin/lib/plugin.sh), checked in their own
  # repositories.
  Exclude:
    - 'image/plugin-overrides/**/*'
    - 'image/plugin-git/**/*'

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 30

Layout/LineLength:
  Max: 120
