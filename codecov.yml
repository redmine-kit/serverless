# Codecov (https://docs.codecov.com/docs/codecov-yaml). CI uploads, with OIDC,
# the coverage of the functions at CloudFront (coverage/edge.lcov, flag edge)
# and of the image's own Ruby files (coverage/image/image.lcov, flag image)
# (docs/testing.md#coverage). The statuses inform and never fail a commit or
# a pull request.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment: false
flags:
  edge:
    paths:
      - edge/
  image:
    paths:
      - image/
ignore:
  - "test/**"
