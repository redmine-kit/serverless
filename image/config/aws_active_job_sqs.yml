# Settings of aws-activejob-sqs (docs/lambda.md#background-jobs). Evaluated as
# ERB. Every ActiveJob queue that Redmine uses goes to the one SQS queue.
queues:
  default: <%= ENV['REDMINE_JOBS_QUEUE_URL'] %>
  mailers: <%= ENV['REDMINE_JOBS_QUEUE_URL'] %>
# Only Redmine's own jobs run, whatever a message in the queue names.
job_class_allowlist:
  - ActionMailer::MailDeliveryJob
  - DestroyProjectJob
  - DestroyProjectsJob
  - WebhookJob
