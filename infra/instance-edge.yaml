AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Serverless instance in us-east-1 (stack <instance>-edge): the certificate
  of the domain and the AWS WAF web ACL that the instance's CloudFront
  distribution uses. CloudFront takes both only from us-east-1
  (docs/deploy-config.md, docs/security.md#aws-waf).

Parameters:
  InstanceName:
    Type: String
    Default: redmine
    AllowedPattern: ^[a-z][a-z0-9-]{0,19}$
  Domain:
    Type: String
    AllowedPattern: ^([a-z0-9-]+\.)+[a-z]{2,}$
    Description: The host name of Redmine (domain in redmine.json).
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      The Route 53 hosted zone of the domain (dns.mode route53). Empty with
      dns.mode external: bin/deploy shows the validation record to add.
  WebAclArn:
    Type: String
    Default: ""
    Description: A web ACL prepared by the adopter (cloudfront.webAclArn). Empty creates one.
  LoginRateLimit:
    Type: Number
    Default: 20
    MinValue: 10
  RateLimit:
    Type: Number
    Default: 1000
    MinValue: 10
  CommonRuleSetAction:
    Type: String
    Default: count
    AllowedValues: [count, block]
  CommonRuleSetCountOnly:
    Type: CommaDelimitedList
    Default: SizeRestrictions_BODY
    Description: Rules of the Common Rule Set that only count even with block.

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  CreateWebAcl: !Equals [!Ref WebAclArn, ""]
  CommonRuleSetCounts: !Equals [!Ref CommonRuleSetAction, count]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref Domain
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasHostedZone
        - - DomainName: !Ref Domain
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue
      Tags:
        - Key: redmine:instance
          Value: !Ref InstanceName

  # The rules of docs/security.md#rules, in that order. Rate limits count
  # per IP address over 5 minutes.
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: CreateWebAcl
    Properties:
      Name: !Sub ${InstanceName}-web
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${InstanceName}-web
      Rules:
        - Name: login-rate-limit
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref LoginRateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch:
                          Method: {}
                        PositionalConstraint: EXACTLY
                        SearchString: POST
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                    # String matches, not a regular expression, which the
                    # Free plan does not allow.
                    - OrStatement:
                        Statements:
                          - ByteMatchStatement:
                              FieldToMatch:
                                UriPath: {}
                              PositionalConstraint: STARTS_WITH
                              SearchString: /login
                              TextTransformations:
                                - Priority: 0
                                  Type: NONE
                          - ByteMatchStatement:
                              FieldToMatch:
                                UriPath: {}
                              PositionalConstraint: STARTS_WITH
                              SearchString: /account/lost_password
                              TextTransformations:
                                - Priority: 0
                                  Type: NONE
                          - ByteMatchStatement:
                              FieldToMatch:
                                UriPath: {}
                              PositionalConstraint: STARTS_WITH
                              SearchString: /account/register
                              TextTransformations:
                                - Priority: 0
                                  Type: NONE
                          - ByteMatchStatement:
                              FieldToMatch:
                                UriPath: {}
                              PositionalConstraint: STARTS_WITH
                              SearchString: /account/twofa
                              TextTransformations:
                                - Priority: 0
                                  Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: login-rate-limit
        - Name: rate-limit
          Priority: 2
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit
        - Name: ip-reputation
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: ip-reputation
        - Name: known-bad-inputs
          Priority: 4
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: known-bad-inputs
        # Counts only at first (waf.commonRuleSet); with block, the rules in
        # CommonRuleSetCountOnly still only count. Uploads to /tmp/incoming/*
        # carry whole files, so the rule set does not look at them at all.
        - Name: common-rule-set
          Priority: 5
          OverrideAction: !If
            - CommonRuleSetCounts
            - Count: {}
            - None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides: !If
                - CommonRuleSetCounts
                - !Ref AWS::NoValue
                - - Name: !Select [0, !Ref CommonRuleSetCountOnly]
                    ActionToUse:
                      Count: {}
              ScopeDownStatement:
                NotStatement:
                  Statement:
                    ByteMatchStatement:
                      FieldToMatch:
                        UriPath: {}
                      PositionalConstraint: STARTS_WITH
                      SearchString: /tmp/incoming/
                      TextTransformations:
                        - Priority: 0
                          Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: common-rule-set

Outputs:
  CertificateArn:
    Value: !Ref Certificate
  WebAclArn:
    Value: !If [CreateWebAcl, !GetAtt WebAcl.Arn, !Ref WebAclArn]
