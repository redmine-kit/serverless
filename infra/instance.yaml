AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Serverless instance (stack <instance>): RDS for PostgreSQL, the job queue,
  and the functions redmine-web and redmine-task in the shared VPC
  (docs/deploy-config.md#shared-base-and-per-instance-resources). The secrets
  SECRET_KEY_BASE and REDMINE_DB_PASSWORD are SecureString parameters that
  bin/deploy creates before this stack.

Parameters:
  InstanceName:
    Type: String
    Default: redmine
    AllowedPattern: ^[a-z][a-z0-9-]{0,19}$
    Description: The instance name (instance in redmine.json).
  SharedStackName:
    Type: String
    Default: redmine-shared
    Description: The stack of the shared base, whose exports this stack uses.
  ImageUri:
    Type: String
    AllowedPattern: ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9/_-]+@sha256:[0-9a-f]{64}$
    Description: The image in this account's ECR, by digest.
  Domain:
    Type: String
    Default: ""
    Description: The host name of Redmine (domain in redmine.json). Empty allows any host.
  DbMajorVersion:
    Type: String
    AllowedPattern: ^[0-9]{2}$
    Description: >-
      The PostgreSQL major version on RDS. Checked against the versions RDS
      offers when the instance is created (docs/rds.md#database).
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbStorageGb:
    Type: Number
    Default: 20
    MinValue: 20
  BackupDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  WebMemoryMb:
    Type: Number
    Default: 2048
  WebReservedConcurrency:
    Type: Number
    Default: 10
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]

Conditions:
  HasDomain: !Not [!Equals [!Ref Domain, ""]]

Resources:
  # Security groups: the functions reach RDS on 5432, nothing reaches the
  # functions (they are invoked through the Lambda API).
  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${InstanceName} functions
      VpcId: !ImportValue
        Fn::Sub: ${SharedStackName}-VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: The private subnets have routes only to the endpoints
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${InstanceName} database
      VpcId: !ImportValue
        Fn::Sub: ${SharedStackName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref FunctionSecurityGroup
          Description: PostgreSQL from the functions

  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub ${InstanceName} database
      SubnetIds: !Split
        - ","
        - !ImportValue
          Fn::Sub: ${SharedStackName}-PrivateSubnetIds
  DatabaseParameters:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Sub ${InstanceName} database, TLS required
      Family: !Sub postgres${DbMajorVersion}
      Parameters:
        rds.force_ssl: "1"
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Ref InstanceName
      Engine: postgres
      EngineVersion: !Ref DbMajorVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbStorageGb
      StorageType: gp3
      StorageEncrypted: true
      DBName: redmine
      MasterUsername: redmine
      MasterUserPassword: !Sub "{{resolve:ssm-secure:/${InstanceName}/env/REDMINE_DB_PASSWORD}}"
      DBSubnetGroupName: !Ref DatabaseSubnets
      DBParameterGroupName: !Ref DatabaseParameters
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: !Ref BackupDays
      DeletionProtection: true
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: redmine:instance
          Value: !Ref InstanceName

  # The host is not a secret; it is read with the secrets at start-up.
  DatabaseHost:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${InstanceName}/env/REDMINE_DB_HOST
      Type: String
      Value: !GetAtt Database.Endpoint.Address

  # Jobs that redmine-web and redmine-task enqueue. redmine-worker, which runs
  # them, is added with jobs and mail sending (stage 6).
  JobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${InstanceName}-jobs-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${InstanceName}-jobs
      # Six times the worker's timeout of 900 seconds, as Lambda recommends for
      # an SQS event source.
      VisibilityTimeout: 5400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDeadLetterQueue.Arn
        maxReceiveCount: 3

  WebLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${InstanceName}-web
      RetentionInDays: !Ref LogRetentionDays
  TaskLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${InstanceName}-task
      RetentionInDays: !Ref LogRetentionDays

  # Permissions common to the functions (docs/iam.md#permissions-common-to-the-three-functions).
  CommonPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub ${InstanceName} functions, common permissions
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Settings
            Effect: Allow
            Action: ssm:GetParametersByPath
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${InstanceName}/env
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${InstanceName}/env/*
          # SecureString with the default key aws/ssm. Whether IAM must allow
          # this is to be verified (docs/iam.md); it is limited to SSM.
          - Sid: DecryptSettings
            Effect: Allow
            Action: kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
          - Sid: Vpc
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: "*"
          - Sid: EnqueueJobs
            Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt JobQueue.Arn

  WebRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${InstanceName}-web
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns: [!Ref CommonPolicy]
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${WebLogs.Arn}:*
        - PolicyName: jobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:GetQueueAttributes
                Resource: [!GetAtt JobQueue.Arn, !GetAtt JobDeadLetterQueue.Arn]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${InstanceName}-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns: [!Ref CommonPolicy]
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${TaskLogs.Arn}:*

  Web:
    Type: AWS::Lambda::Function
    DependsOn: DatabaseHost
    Properties:
      FunctionName: !Sub ${InstanceName}-web
      Role: !GetAtt WebRole.Arn
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [arm64]
      MemorySize: !Ref WebMemoryMb
      Timeout: 60
      # Lambda's default. /tmp holds only files Redmine itself reads (thumbnails,
      # previews, the bulk-download zip); see the S3 plugin's /tmp cache.
      EphemeralStorage:
        Size: 512
      ReservedConcurrentExecutions: !Ref WebReservedConcurrency
      VpcConfig:
        SecurityGroupIds: [!Ref FunctionSecurityGroup]
        SubnetIds: !Split
          - ","
          - !ImportValue
            Fn::Sub: ${SharedStackName}-PrivateSubnetIds
      LoggingConfig:
        LogGroup: !Ref WebLogs
      Environment:
        Variables:
          REDMINE_ROLE: web
          REDMINE_SSM_PATH: !Sub /${InstanceName}/env/
          REDMINE_DB_NAME: redmine
          REDMINE_DB_USERNAME: redmine
          REDMINE_JOBS_QUEUE_URL: !Ref JobQueue
          REDMINE_HOST: !If [HasDomain, !Ref Domain, !Ref AWS::NoValue]
  # IAM authentication: CloudFront signs requests with origin access control
  # (stage 4). Until then, signed requests open it directly.
  WebUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Web.Arn
      AuthType: AWS_IAM
      InvokeMode: BUFFERED

  Task:
    Type: AWS::Lambda::Function
    DependsOn: DatabaseHost
    Properties:
      FunctionName: !Sub ${InstanceName}-task
      Role: !GetAtt TaskRole.Arn
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [arm64]
      MemorySize: 2048
      Timeout: 900
      # Lambda's default. /tmp holds only files Redmine itself reads (thumbnails,
      # previews, the bulk-download zip); see the S3 plugin's /tmp cache.
      EphemeralStorage:
        Size: 512
      # docs/tasks.md#kinds-of-events
      ReservedConcurrentExecutions: 2
      VpcConfig:
        SecurityGroupIds: [!Ref FunctionSecurityGroup]
        SubnetIds: !Split
          - ","
          - !ImportValue
            Fn::Sub: ${SharedStackName}-PrivateSubnetIds
      LoggingConfig:
        LogGroup: !Ref TaskLogs
      Environment:
        Variables:
          REDMINE_ROLE: task
          REDMINE_SSM_PATH: !Sub /${InstanceName}/env/
          REDMINE_DB_NAME: redmine
          REDMINE_DB_USERNAME: redmine
          REDMINE_JOBS_QUEUE_URL: !Ref JobQueue

Outputs:
  WebFunctionUrl:
    Value: !GetAtt WebUrl.FunctionUrl
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  JobQueueUrl:
    Value: !Ref JobQueue
