AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Serverless shared base (stack redmine-shared): the ECR repository and the
  VPC that the instances share (docs/deploy-config.md#shared-base-and-per-instance-resources).

Parameters:
  NetworkMode:
    Type: String
    Default: endpoints
    # The NAT instance (nat) is added in a later stage (docs/rds.md#setup-2-nat-instance).
    AllowedValues: [endpoints]
    Description: The route out of the VPC (network.mode in redmine.json).
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: ^\d+\.\d+\.\d+\.\d+/16$
    Description: The VPC's address range. Each private subnet takes a /20 of it.

Conditions:
  UseEndpoints: !Equals [!Ref NetworkMode, endpoints]

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: redmine
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules": [{"rulePriority": 1, "description": "Keep the last 20 images",
          "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 20},
          "action": {"type": "expire"}}]}

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: redmine-shared

  # Two private subnets in two AZs (an RDS subnet group needs two). There is
  # no internet gateway: AWS services are reached through the endpoints.
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 2, 12]]
      Tags:
        - Key: Name
          Value: redmine-shared-private-1
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 2, 12]]
      Tags:
        - Key: Name
          Value: redmine-shared-private-2

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: redmine-shared-private
  PrivateSubnet1Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable
  PrivateSubnet2Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # S3 through a gateway endpoint (free).
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # Interface endpoints in one AZ each, to keep the fixed cost down
  # (docs/rds.md#setup-1-vpc-endpoints). SES is added with mail sending.
  EndpointSecurityGroup:
    Condition: UseEndpoints
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from the VPC to the interface endpoints
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: HTTPS from the VPC
  SsmEndpoint:
    Condition: UseEndpoints
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnet1]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
  SqsEndpoint:
    Condition: UseEndpoints
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sqs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnet1]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-RepositoryUri
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub ${AWS::StackName}-VpcId
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnetIds
