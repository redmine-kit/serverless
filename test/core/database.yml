# Database of Redmine's own tests (bin/test-core): the PostgreSQL of
# bin/test-services, by its name in Docker and by its address in Apple
# container (TEST_DATABASE_HOST). Parallel workers add -0, -1, ... to the name.
test:
  adapter: postgresql
  host: <%= ENV.fetch('TEST_DATABASE_HOST', 'postgres') %>
  database: redmine_test
  username: postgres
  encoding: unicode
